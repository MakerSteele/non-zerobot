let balState = null;
function paintBalance(b) {
  balState = b;
  const btn = document.getElementById('bal-btn');
  document.getElementById('gear-btn')
    .classList.toggle('fault', !!b && b.state === 'fault');
  if (!b || b.state === 'absent') { btn.style.display = 'none'; return; }
  btn.style.display = '';
  btn.classList.remove('on', 'fault');
  if (b.state === 'fault') {
    btn.classList.add('fault');
    btn.textContent = 'BAL !';
    btn.title = b.fault || 'balance switched itself off';
  } else if (b.state === 'on') {
    btn.classList.add('on');
    btn.textContent = b.pairing === 'confirmed' ? 'BAL ✓' : 'BAL';
    btn.title = b.pairing === 'confirmed'
      ? 'balance on; encoders checked while driving'
      : 'balance on; encoders get checked during your first few turns';
  } else {
    btn.textContent = 'BAL OFF';
    btn.title = 'balance off; TRM steers on its own';
  }
}
function pollBalance() {
  fetch(`${CTL}/balance`, { cache: 'no-store' })
    .then(r => r.json()).then(paintBalance).catch(() => {});
}
function balPost(url, body) {
  return fetch(`${CTL}${url}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(() => pollBalance()).catch(() => {});
}
function tapBalance() {
  const b = balState;
  if (!b) return;
  if (b.state === 'fault') {
    if (b.fault_kind === 'crossed') {
      if (confirm('The encoders look crossed (each one is reading the other ' +
                  'wheel).\n\nSwap them? This is saved.'))
        balPost('/balance/control', { action: 'swap' });
    } else if (confirm('Balance switched itself off:\n' + b.fault +
                       '\n\nTry again?')) {
      balPost('/balance/control', { action: 'clear' });
    }
  } else {
    balPost('/tune', { balance_enabled: b.state !== 'on' });
  }
}
pollBalance();
setInterval(pollBalance, 2500);
setInterval(checkConnection, 3000);

// Fix joystick size after fonts/layout settle
window.addEventListener('resize', () => {
  // Recalculate on orientation change
  releaseAll();
});

// ═══ 13v: VOICE on the drive page — LISTEN, hold-to-TALK, INTERCOM ══════════
// One place for everything voice. Replaces 13c ON AIR (tap on/off) and the
// talk page's LIVE, LISTEN and INTERCOM cards; the talk page (⚙ SOUNDS) keeps
// SAY, RECORD, FILE and the voice settings.
//
//   🎧 LISTEN    hear the robot's mic (works on plain and HTTPS pages)
//   🎤 TALK      HOLD to send your voice; release to stop
//   📞 INTERCOM  hands-free: LISTEN on, and your voice is sent whenever you
//                speak (voice trigger). The button turns green while it sends,
//                so you can see when it's cutting the robot's side off.
//
// Half-duplex: the robot can't hear and talk at the same time (its voice and
// its mic share the Pi's PCM block), so while your voice is sent the robot's
// audio is muted on this phone and its mic pauses. Settings in ⚙: VOL (listen
// volume) and SNS (intercom sensitivity) - both saved on this phone.
//
// Logic ported unchanged from the talk page's INTERCOM (13p/13s): VOX
// thresholds, echo guard, pre-roll, hang times.

// Remote (internet) links deliver audio in bursts: keep a bigger cushion there.
const LIS_LEAD = REMOTE ? 0.3 : 0.15, LIS_MAX = REMOTE ? 1.2 : 0.6, LIS_TARGET = REMOTE ? 0.45 : 0.2;
let lis = null;
let micPhase = 'off';
let micAvailable = false;

function lisVol() {
  let v = 4;
  try { v = Number(localStorage.getItem('zb_listen_vol2')) || 4; } catch (e) {}
  return v;
}

// Change the LISTEN gain now (clears any fade the intercom scheduled)
function setLisGain(v, fade) {
  if (!lis) return;
  const g = lis.gain.gain, t = lis.ctx.currentTime;
  try { g.cancelScheduledValues(t); } catch (e) {}
  if (fade) { g.setValueAtTime(g.value, t); g.setTargetAtTime(v, t, fade); }
  else g.setValueAtTime(v, t);
}

function lisPaint(text) {
  const b = document.getElementById('lis-btn');
  if (!b) return;
  b.classList.toggle('on', !!lis);
  b.innerHTML = '&#127911; ' + (text || (lis ? 'ON' : 'LISTEN'));
}

function stopListen() {
  if (!lis) return;
  if (ic) ic.startedListen = false;
  farLog = [];
  const l = lis; lis = null;
  try { l.ctrl.abort(); } catch (e) {}
  clearInterval(l.poll);
  try { l.ctx.close(); } catch (e) {}
  lisPaint();
  paintVoice();
}

async function lisPoll() {
  const l = lis;
  if (!l) return;
  try {
    const j = await (await fetch('/mic')).json();
    if (lis !== l) return;
    micPhase = j.phase || (j.muted ? 'talking' : 'live');
    lisPaint(j.error ? 'ERR' : j.learning ? 'WAIT' : j.muted ? 'MUTED' : 'ON');
    if (j.error) console.log('[LISTEN] robot mic error: ' + j.error);
    paintVoice();
  } catch (e) {}
}

async function toggleListen() {
  if (lis) {
    if (ic) stopIntercom();          // INTERCOM needs LISTEN; tapping LISTEN off ends both
    stopListen();
    return;
  }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();   // inside the tap (iPhone)
  ctx.resume();
  const gain = ctx.createGain();
  gain.gain.value = (ic && snd.on) ? 0 : lisVol();
  const lim = ctx.createDynamicsCompressor();           // stops loud bits clipping after the volume boost
  lim.threshold.value = -6; lim.knee.value = 0; lim.ratio.value = 20;
  lim.attack.value = 0.003; lim.release.value = 0.1;
  gain.connect(lim); lim.connect(ctx.destination);
  const l = { ctx, gain, ctrl: new AbortController(), next: 0, poll: null };
  lis = l;
  lisPaint('WAIT');
  l.poll = setInterval(lisPoll, 1000);
  try {
    const r = await fetch('/mic/stream', { signal: l.ctrl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    let carry = null;
    while (lis === l) {
      const { value, done } = await reader.read();
      if (done) break;
      let bytes = value;
      if (carry) { const j = new Uint8Array(carry.length + bytes.length); j.set(carry); j.set(bytes, carry.length); bytes = j; carry = null; }
      if (bytes.length & 1) { carry = bytes.slice(bytes.length - 1); bytes = bytes.subarray(0, bytes.length - 1); }
      const n = bytes.length >> 1;
      if (!n) continue;
      const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
      const buf = ctx.createBuffer(1, n, 16000);
      const ch = buf.getChannelData(0);
      let ss = 0;
      for (let i = 0; i < n; i++) { const v = dv.getInt16(2 * i, true) / 32768; ch[i] = v; ss += v * v; }
      const now = ctx.currentTime;
      if (l.next < now + 0.02) l.next = now + LIS_LEAD;
      if (l.next - now > LIS_MAX) continue;
      // the robot's clock and the phone's never match exactly: play up to 2 %
      // faster or slower (not audible) to hold the cushion at LIS_TARGET
      const rate = Math.max(0.98, Math.min(1.02, 1 + (l.next - now - LIS_TARGET) * 0.1));
      const src = ctx.createBufferSource();
      src.buffer = buf; src.playbackRate.value = rate; src.connect(gain); src.start(l.next);
      if (ic && ss > 0) farNote(l, l.next, l.next + n / 16000 / rate, ss / n);
      l.next += n / 16000 / rate;
    }
    if (lis === l) { if (ic) stopIntercom(); stopListen(); }
  } catch (e) {
    if (lis === l) { if (ic) stopIntercom(); stopListen(); console.log('[LISTEN] ' + (e.message || e)); }
  }
}

// ── Phone mic (shared by TALK and INTERCOM) ─────────────────────────────────
// Opened on the first TALK/INTERCOM tap, kept open for 90 s afterwards so the
// next press is instant, and the last 0.3 s is always kept (pre-roll) so a
// word started a hair before the press still goes out.
const PTT_RATE = 16000, PTT_BLOCK = 3200, PTT_PREROLL = 4800, PTT_IDLE_MS = 90000;
let pttCtx = null, pttStream = null, pttSrc = null, pttProc = null, pttDown = null;
let pttPre = new Float32Array(0), pttIdle = null, pttStarting = null;
let micUser = null;          // receives every 16 kHz mic block while set; else pre-roll

function pttDownsampler(inRate) {
  const step = inRate / PTT_RATE;
  let pos = 0, last = 0;
  return function (input) {
    const out = [];
    while (pos < input.length - 1) {
      const i = Math.floor(pos), fr = pos - i;
      const a = i < 0 ? last : input[i], b = input[i + 1];
      out.push(a + (b - a) * fr);
      pos += step;
    }
    pos -= input.length;
    last = input[input.length - 1];
    return Float32Array.from(out);
  };
}

function pttPcm16(f32) {
  const out = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const v = Math.max(-1, Math.min(1, f32[i]));
    out[i] = v < 0 ? v * 32768 : v * 32767;
  }
  return out;
}

function keepPre(block) {
  const j = new Float32Array(pttPre.length + block.length);
  j.set(pttPre, 0); j.set(block, pttPre.length);
  pttPre = j.length > PTT_PREROLL ? j.slice(j.length - PTT_PREROLL) : j;
}
function takePre() { const p = pttPre; pttPre = new Float32Array(0); return p; }

function pttMic() {
  clearTimeout(pttIdle);
  if (pttProc) return Promise.resolve();
  if (pttStarting) return pttStarting;
  if (!window.isSecureContext || !navigator.mediaDevices) {
    return Promise.reject(new Error('The mic needs the https:// page.'));
  }
  // Made inside the tap, before any await - iPhones need that.
  pttCtx = new (window.AudioContext || window.webkitAudioContext)();
  const resumed = pttCtx.resume();
  pttStarting = (async () => {
    try {
      pttStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
      });
      await resumed;
      pttSrc = pttCtx.createMediaStreamSource(pttStream);
      pttProc = pttCtx.createScriptProcessor(4096, 1, 1);
      pttDown = pttDownsampler(pttCtx.sampleRate);
      let gotFirst;
      const first = new Promise(res => { gotFirst = res; });
      pttProc.onaudioprocess = (e) => {
        const block = pttDown(e.inputBuffer.getChannelData(0));
        if (micUser) micUser(block);
        else keepPre(block);
        gotFirst();
      };
      pttSrc.connect(pttProc);
      pttProc.connect(pttCtx.destination);      // needed for onaudioprocess to fire; silent
      await Promise.race([first, new Promise(res => setTimeout(res, 3000))]);
    } catch (e) {
      pttMicStop();
      throw e;
    } finally {
      pttStarting = null;
    }
  })();
  return pttStarting;
}

function pttMicStop() {
  clearTimeout(pttIdle);
  micUser = null;
  try { pttProc && pttProc.disconnect(); } catch (e) {}
  try { pttSrc && pttSrc.disconnect(); } catch (e) {}
  if (pttStream) pttStream.getTracks().forEach(t => t.stop());
  if (pttCtx) { try { pttCtx.close(); } catch (e) {} }
  pttCtx = pttStream = pttSrc = pttProc = null;
  pttPre = new Float32Array(0);
}

function micIdleLater() {
  clearTimeout(pttIdle);
  pttIdle = setTimeout(() => { if (!ic && !snd.on) pttMicStop(); }, PTT_IDLE_MS);
}

function micFail(e) {
  alertOff(e && e.name === 'NotAllowedError'
    ? 'Mic permission was refused. Allow the microphone for this site, then try again.'
    : 'Mic failed: ' + ((e && e.message) || e));
}

// ── Sending your voice (/voice/live, 200 ms blocks, one id per burst) ────────
const snd = { on: false, sid: '', seq: 0, pending: [] };

function sendStart() {
  if (snd.on) return;
  snd.on = true;
  snd.sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  snd.seq = 0;
  snd.pending = Array.from(takePre());
  if (lis) setLisGain(0, 0.02);                  // mute the robot side while you talk
  while (snd.pending.length >= PTT_BLOCK) sendChunk(false);
  paintVoice();
}

function sendFeed(block) {
  for (let i = 0; i < block.length; i++) snd.pending.push(block[i]);
  while (snd.pending.length >= PTT_BLOCK) sendChunk(false);
}

function sendStop() {
  if (!snd.on) return;
  snd.on = false;
  sendChunk(true);
  if (lis) setLisGain(lisVol(), 0.05);
  paintVoice();
}

function sendChunk(end) {
  const n = end ? snd.pending.length : PTT_BLOCK;
  const block = Float32Array.from(snd.pending.splice(0, n));
  const seq = snd.seq++;
  fetch(`/voice/live?sid=${snd.sid}&seq=${seq}${end ? '&end=1' : ''}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/octet-stream' },
    body: pttPcm16(block).buffer
  }).then(async r => {
    if (!r.ok && (snd.on || ic)) {
      let j = {}; try { j = await r.json(); } catch (e) {}
      alertOff('Talk: ' + (j.message || ('robot answered ' + r.status)));
    }
  }).catch(() => { if (snd.on || ic) alertOff('Talk: lost contact with the robot'); });
}

// ── 🎤 TALK: hold to talk ────────────────────────────────────────────────────
const HOLD_TAIL_MS = 150;     // keeps sending this long after release (last syllable)
const hold = { down: false, upAt: 0 };

function holdUser(block) {          // TALK without INTERCOM
  sendFeed(block);
  if (!hold.down && performance.now() - hold.upAt > HOLD_TAIL_MS) {
    micUser = null;
    sendStop();
    micIdleLater();
  }
}

async function holdDown() {
  if (!SECURE) { window.location.href = `https://${PI_IP}:5443/`; return; }
  hold.down = true;
  paintVoice();
  if (ic) {                          // INTERCOM on: holding forces sending
    ic.hold = true; ic.byHold = true;
    if (!snd.on && micUser) icStartSend();
    return;
  }
  try {
    await pttMic();
  } catch (e) { hold.down = false; paintVoice(); micFail(e); return; }
  if (ic) { ic.hold = hold.down; ic.byHold = true; if (hold.down && !snd.on) icStartSend(); return; }
  if (!hold.down && !snd.on) {
    // a quick tap that ended before the mic woke: send what the pre-roll caught
    if (pttPre.length > PTT_RATE * 0.15) { sendStart(); sendStop(); }
    micIdleLater();
    paintVoice();
    return;
  }
  micUser = holdUser;
  sendStart();
}

function holdUp() {
  if (!hold.down) return;
  hold.down = false;
  hold.upAt = performance.now();
  if (ic) { ic.hold = false; ic.holdUp = hold.upAt; }
  paintVoice();
}

(function () {
  const b = document.getElementById('ptt-btn');
  if (!b) return;
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    holdDown();
  });
  b.addEventListener('pointerup', holdUp);
  b.addEventListener('pointercancel', holdUp);
  b.addEventListener('contextmenu', (e) => e.preventDefault());   // long-press menu on phones
})();

// ── 📞 INTERCOM (voice trigger, echo guard) ──────────────────────────────────
const VOX_HANG_MS = 600;      // keep sending this long after your voice drops
const VOX_ATTACK = 2;         // loud blocks in a row (~85 ms each) to start sending
const VOX_ABS_MIN = -50;      // dBFS: never trigger below this, however quiet the room
const FAR_GUARD_DB = 18;      // extra level needed while the robot side is talking
const FAR_HANG_MS = 300;      // ... and this long after it stops (room echo, phone delay)
const NOISE_BLOCKS = 30;      // room-noise window, in mic blocks (~2.5 s)
const VOX_WARM = 4;           // blocks (~0.35 s) after INTERCOM starts before the trigger is armed
let ic = null;                // intercom state while it's on
let farLog = [];              // loud robot pieces scheduled on the phone: {t0, t1} in LISTEN time

function icSens() {
  let v = 5;
  try { v = Number(localStorage.getItem('zb_vox_sens')) || 5; } catch (e) {}
  return v;
}
function voxMargin() { return 22 - 1.6 * icSens(); }   // dB above room noise: 1 -> 20.4, 5 -> 14, 10 -> 6

// Called by the LISTEN loop for every robot piece it schedules (ms = mean square, before volume).
function farNote(l, t0, t1, ms) {
  const db = 10 * Math.log10(ms) + 20 * Math.log10(Math.max(1, lisVol()));
  if (l.farFloor === undefined || db < l.farFloor) l.farFloor = db;
  else l.farFloor += (t1 - t0);                       // floor creeps up ~1 dB per second
  if (db > Math.max(l.farFloor + 10, -55)) farLog.push({ t0, t1 });
  const old = l.ctx.currentTime - 1;
  while (farLog.length && farLog[0].t1 < old) farLog.shift();
}

function farActive() {
  if (!lis || !farLog.length) return false;
  const t = lis.ctx.currentTime;
  return farLog.some(e => e.t0 <= t + 0.05 && e.t1 + FAR_HANG_MS / 1000 >= t);
}

async function toggleIntercom() {
  if (!SECURE) { window.location.href = `https://${PI_IP}:5443/`; return; }
  if (ic) { stopIntercom(); return; }
  if (snd.on) { micUser = null; sendStop(); }
  ic = { hold: hold.down, byHold: hold.down, holdUp: 0, hist: [], above: 0, lastLoud: 0,
         startedListen: false, floor: -60, thr: -50 };
  // Both audio contexts must be made inside this tap (iPhones insist), so
  // nothing is awaited before these two calls.
  if (!lis) { ic.startedListen = true; toggleListen(); }
  const me = ic;
  const opening = pttMic();
  paintVoice();
  try {
    await opening;
    if (ic !== me) return;
    micUser = icUser;
  } catch (e) {
    if (ic === me) stopIntercom();
    micFail(e);
  }
  paintVoice();
}

function stopIntercom() {
  if (!ic) return;
  if (snd.on) sendStop();
  const started = ic.startedListen;
  ic = null;
  if (micUser === icUser) micUser = null;
  micIdleLater();
  if (started) stopListen();
  else if (lis) setLisGain(lisVol());
  farLog = [];
  paintVoice();
}

function icStartSend() {
  if (!ic || snd.on) return;
  ic.lastLoud = performance.now();
  sendStart();
}

function icStopSend() {
  if (!ic || !snd.on) return;
  ic.byHold = false;
  ic.above = 0;
  sendStop();
}

// Every phone-mic block (~85 ms, 16 kHz) while the intercom is on.
function icUser(block) {
  if (!ic) return;
  let s = 0;
  for (let i = 0; i < block.length; i++) s += block[i] * block[i];
  const db = 10 * Math.log10(s / Math.max(1, block.length) + 1e-12);
  // room noise = the quietest block of the last ~2.5 s: the gaps between words
  // drop back to the room, so speech doesn't raise it; a new steady noise
  // (fan, motors) is learned within 2.5 s.
  ic.hist.push(db);
  if (ic.hist.length > NOISE_BLOCKS) ic.hist.shift();
  ic.floor = Math.min(-30, Math.min.apply(null, ic.hist));
  let thr = Math.max(ic.floor + voxMargin(), VOX_ABS_MIN);
  if (!snd.on && farActive()) thr += FAR_GUARD_DB;
  ic.thr = thr;
  const loud = db > thr;
  const now = performance.now();
  if (!snd.on) {
    ic.above = (loud && ic.hist.length > VOX_WARM) ? ic.above + 1 : 0;
    keepPre(block);                                 // goes out with the pre-roll if this starts a burst
    if (ic.hold || ic.above >= VOX_ATTACK) icStartSend();
  } else {
    sendFeed(block);
    if (loud) ic.lastLoud = now;
    const done = ic.byHold ? (!ic.hold && now - ic.holdUp > HOLD_TAIL_MS)
                           : (now - ic.lastLoud > VOX_HANG_MS);
    if (done) icStopSend();
  }
}

// ── Buttons ─────────────────────────────────────────────────────────────────
let voiceLastPaint = '';
function paintVoice() {
  const t = document.getElementById('ptt-btn'), c = document.getElementById('ic-btn');
  if (!t || !c) return;
  let tText, cText, cCls = '';
  tText = snd.on && (hold.down || !ic) ? '&#127908; ON AIR' : hold.down ? '&#127908; WAIT' : '&#127908; TALK';
  if (!ic) cText = '&#128222; INTERCOM';
  else if (snd.on) { cText = '&#128222; SENDING'; cCls = 'send'; }
  else if (!lis) cText = '&#128222; WAIT';
  else if (micPhase === 'talking') { cText = '&#128222; ROBOT'; cCls = 'robot'; }
  else if (micPhase === 'waking') cText = '&#128222; WAIT';
  else { cText = '&#128222; ON'; cCls = 'on'; }
  const key = tText + cText + cCls + snd.on + hold.down;
  if (key === voiceLastPaint) return;
  voiceLastPaint = key;
  t.innerHTML = tText;
  t.classList.toggle('on', snd.on && (hold.down || !ic));
  c.innerHTML = cText;
  c.classList.remove('on', 'send', 'robot');
  if (cCls) c.classList.add(cCls);
}

// ⚙ VOL and SNS, saved on this phone (same keys the talk page used).
function setVoiceVol(v) {
  document.getElementById('vol-val').textContent = v + '×';
  try { localStorage.setItem('zb_listen_vol2', v); } catch (e) {}
  if (lis && !snd.on) setLisGain(Number(v));
}
function setVoiceSens(v) {
  document.getElementById('sns-val').textContent = v;
  try { localStorage.setItem('zb_vox_sens', v); } catch (e) {}
}
(function () {
  const v = lisVol(), s = icSens();
  const vs = document.getElementById('vol-slider'), ss = document.getElementById('sns-slider');
  if (vs) { vs.value = v; document.getElementById('vol-val').textContent = v + '×'; }
  if (ss) { ss.value = s; document.getElementById('sns-val').textContent = s; }
})();

// Leaving the page or locking the phone ends everything and releases the mic.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    hold.down = false;
    if (ic) stopIntercom();
    if (snd.on) { micUser = null; sendStop(); }
    pttMicStop();
    stopListen();
  }
});

// The mic buttons only appear on a robot that actually has the mic. TALK
// (your voice) works on any robot with the motor voice. Checked now and
// every 30 s (the robot may still be looking for its mic).
async function lisCheck() {
  try {
    const j = await (await fetch('/mic')).json();
    micAvailable = !!j.available;
    for (const id of ['lis-btn', 'ic-btn', 'vol-wrap', 'sns-wrap']) {
      const el = document.getElementById(id);
      if (el) el.style.display = micAvailable ? '' : 'none';
    }
    if (micAvailable) return;
  } catch (e) {}
  setTimeout(lisCheck, 30000);
}
lisCheck();
paintVoice();
</script>
